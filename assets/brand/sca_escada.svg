<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SCA — A ESCADA CERTIFICADA · o algoritmo comercial da plataforma
       Desce do degrau barato ao caro e PARA no primeiro degrau que decide.
       O que está embaixo (caro) nunca é executado: vira fantasma. -->
  <rect width="512" height="512" rx="96" fill="#0A1A3C"/>
  <!-- eixo de custo -->
  <line x1="488" y1="500" x2="488" y2="16" stroke="#7FA8D9" stroke-width="1.6" opacity=".7"/>
  <polygon points="488,4 481,18 495,18" fill="#7FA8D9" opacity=".7"/>
  <text x="472" y="30" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7FA8D9">caro</text>
  <text x="472" y="504" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7FA8D9">barato</text>
  <!-- degraus percorridos (não decidiram) -->
  <g stroke="#7FA8D9" stroke-width="6" stroke-linecap="round" opacity=".45">
    <line x1="21" y1="16" x2="75" y2="16"/>
    <line x1="83" y1="82" x2="137" y2="82"/>
    <line x1="145" y1="148" x2="199" y2="148"/>
  </g>
  <!-- O DEGRAU QUE DECIDE -->
  <line x1="207" y1="214" x2="261" y2="214" stroke="#22D3EE" stroke-width="9" stroke-linecap="round"/>
  <g stroke="#E8F6FF" stroke-width="2.6" stroke-linecap="round">
    <line x1="200" y1="214" x2="268" y2="214"/>
    <line x1="234" y1="180" x2="234" y2="248"/>
    <line x1="222" y1="202" x2="246" y2="226"/>
    <line x1="222" y1="226" x2="246" y2="202"/>
  </g>
  <circle cx="234" cy="214" r="5" fill="#E8F6FF"/>
  <text x="234" y="166" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#22D3EE">decide aqui · certificado</text>
  <!-- degraus nunca alcançados: fantasma -->
  <g stroke="#33517E" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 7" opacity=".8">
    <line x1="269" y1="280" x2="323" y2="280"/>
    <line x1="331" y1="346" x2="385" y2="346"/>
    <line x1="393" y1="412" x2="447" y2="412"/>
  </g>
</svg>
