<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SIFR — BLOCH-Z · o vetor de estado no equador: nem |0⟩ nem |1⟩ = Z
       Paleta: Midnight Navy #0A1A3C · ciano #22D3EE
       Rigor: Z é estado de DECISÃO (epistêmico); a analogia com |+⟩ é iconográfica -->
  <rect width="512" height="512" rx="96" fill="#0A1A3C"/>
  <!-- esfera de Bloch -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#7FA8D9" stroke-width="1.6" opacity=".75"/>
  <ellipse cx="256" cy="256" rx="170" ry="47.6" fill="none" stroke="#22D3EE" stroke-width="1.8" opacity=".55"/>
  <ellipse cx="256" cy="256" rx="47.6" ry="170" fill="none" stroke="#7FA8D9" stroke-width=".8" opacity=".35"/>
  <line x1="256" y1="86" x2="256" y2="426" stroke="#7FA8D9" stroke-width=".9" stroke-dasharray="2 4" opacity=".5"/>
  <!-- polos -->
  <text x="256" y="66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#E8F6FF">|0⟩</text>
  <text x="256" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#E8F6FF">|1⟩</text>
  <!-- os dois colapsos possíveis (Decision Kernel) -->
  <path d="M396.9,229.4 C426,136 290,136 256,86" fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-dasharray="5 5" opacity=".5"/>
  <path d="M396.9,229.4 C441,356 293,356 256,426" fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-dasharray="5 5" opacity=".5"/>
  <!-- vetor de estado: aponta ao EQUADOR -->
  <line x1="256" y1="256" x2="396.9" y2="229.4" stroke="#22D3EE" stroke-width="3.4"/>
  <polygon points="396.9,229.4 380.5,239.6 377.9,225.9" fill="#22D3EE"/>
  <!-- o diamante do Z na ponta -->
  <g stroke="#E8F6FF" stroke-width="2.6" stroke-linecap="round">
    <line x1="362.9" y1="229.4" x2="430.9" y2="229.4"/>
    <line x1="396.9" y1="195.4" x2="396.9" y2="263.4"/>
    <line x1="384.2" y1="216.7" x2="409.6" y2="242.1"/>
    <line x1="384.2" y1="242.1" x2="409.6" y2="216.7"/>
  </g>
  <text x="448.9" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#22D3EE">Z</text>
</svg>
