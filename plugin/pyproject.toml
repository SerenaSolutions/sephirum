[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zephirum-quantum-plugin"
version = "0.5.1"
description = "Zephirum plugin for the quantum world — ZYQL (say Zykel: the Zephirum Query Language) decides entanglement exactly with a verifiable certificate, zero QPU units"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary - Serena Solutions" }
authors = [{ name = "Serena Solutions / QALQON" }]
keywords = ["quantum", "entanglement", "proof", "certificate", "zephirum", "zyql"]

[project.optional-dependencies]
qiskit = ["qiskit"]
cirq = ["cirq"]

[project.scripts]
zephirum-q = "zephirum_quantum_plugin.cli:main"

[tool.setuptools]
packages = ["zephirum_quantum_plugin"]
